name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, test, static, deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json # you already have one: single source of truth for the SDK version

      - name: Restore
        run: dotnet restore CivicConnect.sln

      # Static / code-quality check #1: formatting and style rules from .editorconfig
      - name: Format check
        run: dotnet format CivicConnect.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build CivicConnect.sln -c Release --no-restore -warnaserror

      - name: Test (with coverage)
        run: >
          dotnet test CivicConnect.sln -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      # Security / dependency check: fail on known-vulnerable NuGet packages
      - name: NuGet vulnerability scan
        run: |
          dotnet list CivicConnect.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found."
            exit 1
          fi

      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: |
            TestResults/**
            vulnerable.txt
          retention-days: 90

  frontend:
    name: Frontend (lint, test, build, deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # set to whatever `node -v` is locally, and record it in PED §7.7
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build

      - name: npm audit (high and critical)
        run: npm audit --audit-level=high

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, same as your local gitleaks run
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest
          detect --source=/repo --redact --verbose

  ci-gate:
    name: CI gate
    if: always()
    needs: [backend, frontend, secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
