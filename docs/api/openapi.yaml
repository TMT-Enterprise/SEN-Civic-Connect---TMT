openapi: 3.0.3
info:
  title: CivicConnect API
  version: 1.0.0
  description: API contract for CivicConnect
servers:
  - url: http://localhost:5228
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required: [code, message]

    ValidationProblem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required: [title, status, errors]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [name, email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    TokenResponse:
      type: object
      properties:
        token:
          type: string
        role:
          type: string
          enum: [requester, staff, management]

    ServiceRequest:
      type: object
      properties:
        requestId:
          type: integer
        description:
          type: string
        categoryId:
          type: integer
        status:
          type: string
          enum: [Submitted, Assigned, In Progress, Resolved, Closed, Overdue]
        submittedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time

    RequestSearchResponse:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/RequestSearchItem'
        message:
          type: string
          nullable: true
      required: [requests, message]

    RequestSearchItem:
      type: object
      properties:
        requestId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        category:
          type: string
        assignedEmployeeId:
          type: integer
          format: int64
          nullable: true
        assignee:
          type: string
          nullable: true
        status:
          type: string
          enum: [Submitted, Assigned, In Progress, Resolved, Closed, Overdue]
        description:
          type: string
        submittedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - requestId
        - categoryId
        - category
        - assignedEmployeeId
        - assignee
        - status
        - description
        - submittedAt
        - dueAt
        - updatedAt
        - closedAt

    SubmitRequestBody:
      type: object
      properties:
        categoryId:
          type: integer
        description:
          type: string
      required: [categoryId, description]

    AssignRequestBody:
      type: object
      properties:
        employeeId:
          type: integer
        dueAt:
          type: string
          format: date-time
      required: [employeeId, dueAt]

    DecideRequestBody:
      type: object
      properties:
        decision:
          type: string
          enum: [Accepted, Rejected]
        rejectionComment:
          type: string
      required: [decision]

    UpdateStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [InProgress, Resolved, Closed]
        completionNote:
          type: string
      required: [status]

    Assignment:
      type: object
      properties:
        assignmentId:
          type: integer
          format: int64
        requestId:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
        assignedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
          nullable: true
        decision:
          type: string
          enum: [Pending, Accepted, Rejected]
        decisionAt:
          type: string
          format: date-time
          nullable: true
        requestStatus:
          type: string
          enum: [Submitted, Assigned, InProgress, Resolved, Closed]

    StatusChange:
      type: object
      properties:
        requestId:
          type: integer
          format: int64
        status:
          type: string
          enum: [Submitted, Assigned, InProgress, Resolved, Closed]

    HistoryEntry:
      type: object
      properties:
        historyId:
          type: integer
          format: int64
        requestId:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          description: Status name as stored, for example Assigned or In Progress
        changedAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        categoryId:
          type: integer
        type:
          type: string
        isActive:
          type: boolean

paths:
  /api/v1/auth/register:
    post:
      summary: Register a new requester (FR-001)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered successfully
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      summary: Login for all roles (FR-002)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/categories:
    get:
      summary: List active service categories (FR-003)
      tags: [Categories]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          description: Authenticated users
    post:
      summary: Add a new category (FR-017) - management only
      tags: [Categories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
              required: [type]
      responses:
        '201':
          description: Category created
        '401':
          description: Authenticated users
        '403':
          description: Forbidden - management only
        '409':
          description: Duplicate category
        '422':
          description: Validation failed

  /api/v1/categories/{id}:
    put:
      summary: Update a category (FR-017) - management only
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                isActive:
                  type: boolean
      responses:
        '200':
          description: Category updated
        '401':
          description: Authenticated users
        '403':
          description: Forbidden - management only
        '404':
          description: Category not found
        '409':
          description: Duplicate category name
    delete:
      summary: Delete a category (FR-017) - management only
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '401':
          description: Authenticated users
        '403':
          description: Forbidden - management only
        '404':
          description: Category not found
        '409':
          description: Cannot delete last category

  /api/v1/requests:
    post:
      summary: Submit a new service request (FR-003, FR-004)
      tags: [Requests]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequestBody'
      responses:
        '201':
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '401':
          description: Authenticated users
        '403':
          description: Forbidden - requester only
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
    get:
      summary: List requester's own requests (FR-007)
      tags: [Requests]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceRequest'
        '401':
          description: Authenticated users
        '403':
          description: Forbidden - requester only

  /api/v1/requests/{id}:
    get:
      summary: Get a single request (FR-005, FR-007)
      tags: [Requests]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '401':
          description: Authenticated users
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/requests/{id}/assign:
    post:
      summary: Assign a request to staff (FR-008) - management only
      description: >
        The due date must be at least 24 hours from now (exactly 24 hours is accepted).
        The assignment, the status change and the history row are committed in one transaction.
      tags: [Requests]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequestBody'
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          description: Authenticated users
        '403':
          description: Forbidden - management only
        '404':
          description: Request not found, or employee not found or inactive
        '409':
          description: Already assigned (including a concurrent assignment)
        '422':
          description: Due date less than 24 hours

  /api/v1/requests/{id}/decide:
    post:
      summary: Accept or reject an assigned request (FR-010, FR-011) - staff only
      description: >
        Only the assigned employee can decide, and only once. Accepting leaves the request Assigned.
        Rejecting stores the comment, returns the request to the unassigned pool (Submitted) and
        writes a history row, all in one transaction.
      tags: [Requests]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideRequestBody'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          description: Authenticated users
        '403':
          description: Forbidden - assigned staff only
        '404':
          description: Request not found
        '409':
          description: Decision already made, or no open assignment
        '422':
          description: Rejection requires comment, or decision is not Accepted or Rejected

  /api/v1/requests/{id}/status:
    patch:
      summary: Update request status (FR-011, FR-013) - staff only
      description: >
        Allowed for the assigned employee. Closing requires a completionNote.
        Assigned and Submitted are only set through assign and reject.
      tags: [Requests]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusBody'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusChange'
        '401':
          description: Authenticated users
        '403':
          description: Forbidden - assigned staff only
        '404':
          description: Request not found
        '409':
          description: Invalid status transition
        '422':
          description: Closing requires completion note, or status value not supported

  /api/v1/requests/{id}/history:
    get:
      summary: Read a request's status history (FR-013) - employees only
      description: History is insert-and-read only. There is no update or delete.
      tags: [Requests]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: History entries, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryEntry'
        '401':
          description: Authenticated users
        '403':
          description: Forbidden - employees only
  
  /api/v1/staff/requests:
    get:
      summary: Staff queue - search and filter own requests (FR-009)
      description: >
        Staff can only see requests assigned to their employee account.
        Text filters use case-insensitive partial matching. dueDate accepts
        yyyy, yyyy-MM, or yyyy-MM-dd. An empty filter returns all permitted
        requests; an empty result includes a helpful message.
      tags: [Staff]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Partial match against request ID, status, due date, category, or assignee.
        - in: query
          name: id
          schema:
            type: string
          description: Case-insensitive partial request ID match.
        - in: query
          name: status
          schema:
            type: string
          description: Case-insensitive partial status match.
        - in: query
          name: dueDate
          schema:
            type: string
            pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
          description: Match a UTC date, month, or year prefix.
        - in: query
          name: category
          schema:
            type: string
          description: Case-insensitive partial category name.
        - in: query
          name: assignee
          schema:
            type: string
          description: Case-insensitive partial assignee name.
        - in: query
          name: categoryId
          schema:
            type: integer
      responses:
        '200':
          description: Filtered list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestSearchResponse'
        '401':
          description: Authenticated users
        '403':
          description: Forbidden — staff only
        '400':
          description: Invalid date filter

  /api/v1/admin/requests:
    get:
      summary: Admin view - all requests with filters (FR-008, FR-009)
      description: >
        Admins can see all requests, including unassigned requests, and can
        filter by assignee. Text filters use case-insensitive partial matching.
        dueDate accepts yyyy, yyyy-MM, or yyyy-MM-dd. An empty filter returns
        all requests; an empty result includes a helpful message.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Partial match against request ID, status, due date, category, or assignee.
        - in: query
          name: id
          schema:
            type: string
          description: Case-insensitive partial request ID match.
        - in: query
          name: status
          schema:
            type: string
          description: Case-insensitive partial status match.
        - in: query
          name: dueDate
          schema:
            type: string
            pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
          description: Match a UTC date, month, or year prefix.
        - in: query
          name: category
          schema:
            type: string
          description: Case-insensitive partial category name.
        - in: query
          name: assignee
          schema:
            type: string
          description: Case-insensitive partial assignee name.
        - in: query
          name: categoryId
          schema:
            type: integer
        - in: query
          name: assignedEmployeeId
          schema:
            type: integer
          description: Restrict to a single assignee.
        - in: query
          name: unassigned
          schema:
            type: boolean
          description: Restrict results to requests without an assignee.
      responses:
        '200':
          description: Filtered list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestSearchResponse'
        '401':
          description: Authenticated users
        '403':
          description: Forbidden - admin only
        '400':
          description: Invalid date filter

  /api/v1/management/dashboard:
    get:
      summary: Management dashboard stats (FR-014)
      tags: [Management]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalRequests:
                    type: integer
                  openRequests:
                    type: integer
                  overdueRequests:
                    type: integer
                  averageResolutionTimeHours:
                    type: number
        '401':
          description: Authenticated users
        '403':
          description: Forbidden - management only

  /api/v1/management/requests:
    get:
      summary: Management view - all requests with full lifecycle (FR-015, FR-016)
      tags: [Management]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: integer
        - in: query
          name: assignedEmployeeId
          schema:
            type: integer
        - in: query
          name: dueDateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dueDateTo
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Filtered list with lifecycle history
        '401':
          description: Authenticated users
        '403':
          description: Forbidden - management only