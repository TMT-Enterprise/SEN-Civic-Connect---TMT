openapi: 3.0.3
info:
  title: CivicConnect API
  version: 1.0.0
  description: API contract for CivicConnect

  servers:
  - url: http://localhost:5228
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required: [code, message]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [name, email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    TokenResponse:
      type: object
      properties:
        token:
          type: string
        role:
          type: string
          enum: [requester, staff, management]

    ServiceRequest:
      type: object
      properties:
        requestId:
          type: integer
        description:
          type: string
        categoryId:
          type: integer
        status:
          type: string
          enum: [Submitted, Assigned, InProgress, Resolved, Overdue]
        submittedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time

    SubmitRequestBody:
      type: object
      properties:
        categoryId:
          type: integer
        description:
          type: string
      required: [categoryId, description]

    AssignRequestBody:
      type: object
      properties:
        employeeId:
          type: integer
        dueAt:
          type: string
          format: date-time
      required: [employeeId, dueAt]

    DecideRequestBody:
      type: object
      properties:
        decision:
          type: string
          enum: [Accepted, Rejected]
        rejectionComment:
          type: string
      required: [decision]

    UpdateStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [InProgress, Resolved]
        completionNote:
          type: string
      required: [status]

    Category:
      type: object
      properties:
        categoryId:
          type: integer
        type:
          type: string
        isActive:
          type: boolean

paths:
  /auth/register:
    post:
      summary: Register a new requester (FR-001)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered successfully
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Login for all roles (FR-002)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories:
    get:
      summary: List active service categories (FR-003)
      tags: [Categories]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          description: Unauthenticated
    post:
      summary: Add a new category (FR-017) - management only
      tags: [Categories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
              required: [type]
      responses:
        '201':
          description: Category created
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - management only
        '409':
          description: Duplicate category
        '422':
          description: Validation failed

  /categories/{id}:
    put:
      summary: Update a category (FR-017) - management only
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                isActive:
                  type: boolean
      responses:
        '200':
          description: Category updated
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - management only
        '404':
          description: Category not found
        '409':
          description: Duplicate category name
    delete:
      summary: Delete a category (FR-017) - management only
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - management only
        '404':
          description: Category not found
        '409':
          description: Cannot delete last category

  /requests:
    post:
      summary: Submit a new service request (FR-003, FR-004)
      tags: [Requests]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequestBody'
      responses:
        '201':
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - requester only
        '422':
          description: Validation failed
    get:
      summary: List requester's own requests (FR-007)
      tags: [Requests]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceRequest'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - requester only

  /requests/{id}:
    get:
      summary: Get a single request (FR-005, FR-007)
      tags: [Requests]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found

  /requests/{id}/assign:
    post:
      summary: Assign a request to staff (FR-008) - management only
      tags: [Requests]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequestBody'
      responses:
        '200':
          description: Assigned
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - management only
        '404':
          description: Request not found
        '409':
          description: Already assigned
        '422':
          description: Due date less than 24 hours

  /requests/{id}/decide:
    post:
      summary: Accept or reject an assigned request (FR-010) - staff only
      tags: [Requests]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideRequestBody'
      responses:
        '200':
          description: Decision recorded
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - assigned staff only
        '404':
          description: Request not found
        '409':
          description: Decision already made
        '422':
          description: Rejection requires comment

  /requests/{id}/status:
    patch:
      summary: Update request status (FR-011, FR-013) - staff only
      tags: [Requests]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusBody'
      responses:
        '200':
          description: Status updated
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - staff only
        '404':
          description: Request not found
        '409':
          description: Invalid status transition
        '422':
          description: Closing requires completion note

  /staff/requests:
    get:
      summary: Staff queue - search and filter own requests (FR-009)
      tags: [Staff]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: integer
        - in: query
          name: dueDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Filtered list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceRequest'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden — staff only

  /admin/requests:
    get:
      summary: Admin view - all requests with filters (FR-008, FR-009)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: integer
        - in: query
          name: assignedEmployeeId
          schema:
            type: integer
      responses:
        '200':
          description: Filtered list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceRequest'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - admin only

  /management/dashboard:
    get:
      summary: Management dashboard stats (FR-014)
      tags: [Management]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalRequests:
                    type: integer
                  openRequests:
                    type: integer
                  overdueRequests:
                    type: integer
                  averageResolutionTimeHours:
                    type: number
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - management only

  /management/requests:
    get:
      summary: Management view - all requests with full lifecycle (FR-015, FR-016)
      tags: [Management]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: integer
        - in: query
          name: assignedEmployeeId
          schema:
            type: integer
        - in: query
          name: dueDateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dueDateTo
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Filtered list with lifecycle history
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden - management only