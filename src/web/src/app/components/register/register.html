<div class="parent">
<div class="auth-container">
        
        <!-- Header / Logo section -->
        <div class="text-center mb-4">
            <div class="brand-box mx-auto mb-3">C</div>
            <h2 class="fw-bold text-dark fs-3">Create Account</h2>
            <p class="text-muted small">Join CivicConnect to manage service requests seamlessly</p>
        </div>

        <!-- Form Card Container -->
        <div class="card border border-light-subtle shadow-sm bg-white rounded-4 p-4">
            <form (ngSubmit)="onRegister()">
                <!-- Name and Surname Row -->
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label for="fName" class="form-label small fw-semibold text-secondary">Name <span class="text-orange">*</span></label>
                        <div class="input-group custom-input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input id="fName" [(ngModel)]="registration.firstName" name="firstName" type="text" class="form-control py-2.5" placeholder="Sipho" required>
                        </div>
                    </div>
                    <div class="col-6">
                        <label for="surname" class="form-label small fw-semibold text-secondary">Surname <span class="text-orange">*</span></label>
                        <input id="surname" [(ngModel)]="registration.surname" name="surname" type="text" class="form-control form-control-standalone py-2.5 px-3" placeholder="Dlamini" required>
                    </div>
                </div>

                <!-- Phone Number Field -->
                <div class="mb-3">
                    <label for="phoneNumber" class="form-label small fw-semibold text-secondary">Phone Number <span class="text-orange">*</span></label>
                    <div class="input-group custom-input-group">
                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                        <input id="phoneNumber" [(ngModel)]="registration.phoneNumber" name="phoneNumber" type="tel" maxlength="30" class="form-control py-2.5" placeholder="+27 (555) 000-0000" required>
                    </div>
                </div>

                <!-- Email Field -->
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-secondary">Email Address <span class="text-orange">*</span></label>
                    <div class="input-group custom-input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input id="email" [(ngModel)]="registration.email" name="email" type="email" class="form-control py-2.5" placeholder="john@example.com" required>
                    </div>
                </div>

                <!-- Password Field with Toggle Eye -->
                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold text-secondary">Password <span class="text-orange">*</span></label>
                    <div class="input-group custom-input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input name="password" [(ngModel)]="registration.password" [type]="showPassword ? 'text' : 'password'" id="passwordInput" minlength="8" class="form-control py-2.5 border-start-0 border-end-0" placeholder="Create a password (at least 8 characters)" required>
                        <button
                        class="btn password-toggle-btn px-3" 
                        type="button" 
                        id="togglePasswordBtn"
                        (click)="togglePassword()"
                        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                        [attr.aria-pressed]="showPassword">
                            <i class="fas fa-eye" id="toggleIcon" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                @if (errorMessage) {
                    <div class="text-danger small mb-3" role="alert">{{ errorMessage }}</div>
                }

                <button type="submit" [disabled]="isSubmitting" class="btn btn-orange w-100 py-2.5 rounded-3 fw-semibold small shadow-sm">
                    {{ isSubmitting ? 'Creating account...' : 'Register & Sign In' }}
                </button>
            </form>

            <!-- Login Link Footer -->
            <div class="text-center mt-4 pt-3 border-top border-light">
                <p class="small text-muted mb-0">Already have an account? 
                    <a routerLink="/login" class="text-orange text-decoration-none fw-semibold">Sign In</a>
                </p>
            </div>
        </div>

    </div>
</div>
