
<section class="new-request-page">
  <div class="form-card">
    <div class="form-heading">
      <h2>Create Service Request</h2>
      <p>
        Please provide accurate details to help us assist you faster.
      </p>
    </div>

    @if (successMessage()) {
      <div class="success-message" role="status">
        <h3>Request submitted</h3>
        <p>{{ successMessage() }}</p>
        <button
          type="button"
          class="btn submit-button w-100"
          (click)="goToRequests()">
          View My Requests
        </button>
      </div>
    } @else {
      @if (errorMessage()) {
        <p class="error-message" role="alert">
          {{ errorMessage() }}
        </p>
      }

      <form (ngSubmit)="submitRequest()">
        <div class="mb-3">
          <label for="requestType" class="form-label">
            Request Category <span>*</span>
          </label>

          <select
            id="requestType"
            name="categoryId"
            class="form-select"
            [(ngModel)]="categoryId"
            required>
            <option [ngValue]="null" disabled>
              Select category...
            </option>
            @for (category of categories; track category.id) {
              <option [ngValue]="category.id">
                {{ category.name }}
              </option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">
            Issue Description <span>*</span>
          </label>

          <textarea
            id="description"
            name="description"
            class="form-control"
            rows="4"
            placeholder="Describe the problem or service needed..."
            [(ngModel)]="description"
            required
            maxlength="2000"></textarea>
        </div>

        <button
          type="submit"
          class="btn submit-button w-100"
          [disabled]="isSubmitting()">
          @if (isSubmitting()) {
            Submitting...
          } @else {
            Submit Request
          }
        </button>
      </form>
    }
  </div>
</section>
