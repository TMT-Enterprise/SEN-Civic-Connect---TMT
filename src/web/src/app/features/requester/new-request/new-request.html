<section class="new-request-page">
  <div class="form-card">
    <div class="form-heading"><h2>Create Service Request</h2><p>Please provide accurate details to help us assist you faster.</p></div>
    <form (ngSubmit)="submit()">
      @if (errorMessage) { <div class="alert alert-danger" role="alert">{{ errorMessage }}</div> }
      <div class="mb-3"><label for="requestType" class="form-label">Request Category <span>*</span></label>
        <select id="requestType" name="categoryId" class="form-select" [(ngModel)]="model.categoryId" required [disabled]="loadingCategories || submitting">
          <option value="" disabled>Select category...</option>
          @for (category of categories; track category.categoryId) { <option [value]="category.categoryId">{{ category.type }}</option> }
        </select>
        @if (!loadingCategories && categories.length === 0) { <small class="text-muted">No active categories are available.</small> }
      </div>
      <div class="mb-3"><label for="description" class="form-label">Issue Description <span>*</span></label>
        <textarea id="description" name="description" class="form-control" rows="5" [(ngModel)]="model.description" placeholder="Describe the problem or service needed..." required maxlength="4000"></textarea>
      </div>
      <button type="submit" class="btn submit-button w-100" [disabled]="submitting || loadingCategories || categories.length === 0">{{ submitting ? 'Submitting…' : 'Submit Request' }} <i class="fa-solid fa-paper-plane ms-2" aria-hidden="true"></i></button>
    </form>
  </div>
</section>
