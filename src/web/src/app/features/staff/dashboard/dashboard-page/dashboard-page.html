
<div class="dashboard-page">

  <section class="metrics-grid" aria-label="Request summary">

    <app-metric-card
      label="Active Queue"
      value="{{ count() }}"
      icon="fa-clipboard-list">
    </app-metric-card>

    <app-metric-card
      label="Pending Action"
      value="{{ count('Assigned') }}"
      icon="fa-clock-rotate-left">
    </app-metric-card>

    <app-metric-card
      label="In Progress"
      value="{{ count('In Progress') }}"
      icon="fa-spinner">
    </app-metric-card>

    <app-metric-card
      label="Resolved"
      value="{{ count('Resolved') }}"
      icon="fa-circle-check">
    </app-metric-card>

  </section>

  <app-request-table></app-request-table>

</div>
