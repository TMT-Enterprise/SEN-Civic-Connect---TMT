<article class="metric-card" [class]="'metric-card tone-' + tone()">
  <span class="metric-label">{{ label() }}</span>

  <div class="metric-value">
    <strong>{{ value() }}</strong>

    @if (detail()) {
      <span class="metric-detail">{{ detail() }}</span>
    }

    @if (icon()) {
      <i [class]="'fa-solid ' + icon()" aria-hidden="true"></i>
    }
  </div>
</article>
