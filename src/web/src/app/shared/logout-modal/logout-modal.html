@if (isOpen()) {
  <div class="modal-layer">
    <button
      type="button"
      class="modal-backdrop-custom"
      aria-label="Close dialog"
      (click)="close()">
    </button>

    <div
      class="logout-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="logout-modal-title">

      <div class="logout-modal-body">
        <span class="logout-icon" aria-hidden="true">
          <i class="fa-solid fa-right-from-bracket"></i>
        </span>

        <h2 id="logout-modal-title">Log out?</h2>
        <p>Are you sure you want to log out of CivicConnect?</p>
      </div>

      <div class="logout-modal-footer">
        <button type="button" class="btn btn-sm cancel-button" (click)="close()">
          Cancel
        </button>

        <button type="button" class="btn btn-sm confirm-button" (click)="confirm()">
          <i class="fa-solid fa-right-from-bracket me-1"></i>
          Log out
        </button>
      </div>
    </div>
  </div>
}
