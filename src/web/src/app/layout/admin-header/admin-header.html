<header class="admin-header">
  <div class="header-title">
    <h1>Admin &amp; Dispatch Portal</h1>
    <p>Municipal service request management</p>
  </div>

  <div class="header-actions">
    <div class="search-wrapper">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>

      <input
        type="search"
        class="form-control admin-search"
        placeholder="Search ID, Citizen, Staff, or Type..."
        aria-label="Search requests"
      />
    </div>

    <button
  type="button"
  class="admin-mode"
  aria-label="Admin mode active. Click to log out"
  (click)="openLogout()">
  <i class="fa-solid fa-user-shield" aria-hidden="true"></i>
  <span>Admin Mode: <strong>Active</strong></span>
</button>
  </div>
</header>
<app-logout-modal
  [isOpen]="isLogoutOpen"
  (closed)="closeLogout()">
</app-logout-modal>
