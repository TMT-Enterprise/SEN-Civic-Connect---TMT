<aside class="staff-sidebar">
  <a class="staff-brand" routerLink="/staff">
    <span class="brand-logo">C</span>

    <span class="brand-copy">
      <strong>CivicConnect</strong>
      <small>Staff Portal</small>
    </span>
  </a>

  <nav class="staff-nav" aria-label="Staff navigation">
    <a
      class="staff-nav-link"
      routerLink="/staff"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
      <span>Dashboard</span>
    </a>

    <a
      class="staff-nav-link"
      routerLink="/staff/history"
      routerLinkActive="active"
    >
      <i class="fa-solid fa-box-archive" aria-hidden="true"></i>
      <span>Request History</span>
    </a>
  </nav>

  <button
  type="button"
  class="staff-profile"
  aria-label="Account menu. Click to log out"
  (click)="openLogout()">
  <div class="staff-avatar">SM</div>

  <div class="staff-profile-copy">
    <strong>Staff Member</strong>
    <small>Field Specialist</small>
  </div>

  <i
    class="fa-solid fa-circle-check staff-badge"
    title="Active staff member"
    aria-hidden="true"
  ></i>
</button>
</aside>
<app-logout-modal
  [isOpen]="isLogoutOpen"
  (closed)="closeLogout()">
</app-logout-modal>
