<header class="app-header">
  <div class="brand-icon" aria-hidden="true">
    C
  </div>

  <div class="brand-text">
    <h1>CivicConnect</h1>
    <p>Service Requests</p>
  </div>

  <button
    type="button"
    class="header-icon-button"
    aria-label="Log out"
    title="Log out"
    (click)="openLogout()">
    <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
  </button>
</header>

<app-logout-modal
  [isOpen]="isLogoutOpen"
  (closed)="closeLogout()">
</app-logout-modal>
